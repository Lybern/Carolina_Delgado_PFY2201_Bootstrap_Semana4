<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Responsivo con Bootstrap 5</title>

  <!-- Enlace a Bootstrap 5.3 CSS por CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- ============================================== -->
  <!-- ENCABEZADO Y BARRA DE NAVEGACIÓN (HEADER/NAV)  -->
  <!-- ============================================== -->
  <header>
    <!-- Barra de navegación con tema oscuro y colapsable en móviles -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <!-- Logo o Nombre de la Marca -->
        <a class="navbar-brand fw-bold" href="#"> MiSitioWeb</a>

        <!-- Botón Hamburguesa para dispositivos móviles (toggler) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú de navegación">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Contenido colapsable de la barra de navegación -->
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <!-- Enlaces de navegación principales -->
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Servicios</a>
            </li>
            <!-- Menú Desplegable (Dropdown) -->
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Productos
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Categoría 1</a></li>
                <li><a class="dropdown-item" href="#">Categoría 2</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#">Ofertas especiales</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contacto</a>
            </li>
          </ul>

          <!-- Formulario de búsqueda a la derecha -->
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Buscar">
            <button class="btn btn-outline-light" type="submit">Buscar</button>
          </form>
        </div>
      </div>
    </nav>
  </header>

  <!-- ============================================== -->
  <!-- CONTENIDO PRINCIPAL                            -->
  <!-- ============================================== -->
  <main class="container my-5 flex-grow-1">
    <div class="p-5 text-center bg-body-tertiary rounded-3">
      <h1 class="text-body-emphasis">¡Bienvenido a Mi Sitio Web!</h1>
      <p class="lead">
        Esta es una página responsiva construida con Bootstrap 5.
      </p>
    </div>
  </main>

  <!-- ============================================== -->
  <!-- PIE DE PÁGINA (FOOTER CON COLOR AZUL / PRIMARY)-->
  <!-- ============================================== -->
  <footer class="bg-primary text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2026 MiSitioWeb. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- ============================================== -->
  <!-- SCRIPTS DE BOOTSTRAP 5 (JS BUNDLE CON POPPER)  -->
  <!-- ============================================== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
