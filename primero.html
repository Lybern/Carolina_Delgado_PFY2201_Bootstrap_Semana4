<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera página con Bootstrap</title>
    <!-- CSS de Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Estilo para visualizar los bordes de las columnas -->
    <style>
        .borde-rojo {
            border: 1px solid red;
            padding: 10px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container text-center">
        <div class="row">
            <div class="col-12 col-md-12 borde-rojo">
                Column 1
            </div>
            <div class="col-12 col-sm-6 col-md-6 col-lg-4 col-xl-3 borde-rojo">
                Column 2, con información adicional
            </div>
            <div class="col-12 col-md-6 col-lg-4 col-xl-3 borde-rojo">
                Column 3, con otra información adicional
            </div>
            <div class="col-12 col-md-6 col-lg-4 col-xl-3 borde-rojo">
                Column 3, con otra información adicional
            </div>
            <div class="col-12 borde-rojo">
                Column Final
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap al final del body -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6lcgdCROaejBq+UeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
